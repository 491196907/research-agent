name: tests

on:
  push:
  pull_request:
  workflow_dispatch:        # 也可以手动点一下就跑

concurrency:                # 同一个分支连续 push 时，取消上一次还没跑完的
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 测试全部用 monkeypatch 桩掉了网络和 API，所以不需要任何密钥
      # 只装这三个（不装 streamlit），CI 能快不少
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy pytest

      - name: 跑测试
        run: python -m pytest tests -q

